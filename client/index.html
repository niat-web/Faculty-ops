<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F25C05" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>FacultyOps · NIAT Campus Suite</title>
    <style>
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f1f5f9; font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
      #boot .mark { font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: #F25C05; animation: boot-pulse 1.3s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none; opacity: 0.7; } }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"><div id="boot"><div class="mark">FacultyOps</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
